<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Main Page After Login</title>
  <style>
    body {
      margin: 0;
        background-color: #eec8d6;
      font-family: Arial, sans-serif;
    }

    .main-page-after {
      padding: 20px;
      position: relative;
    }

    .sky-logo {
      width: 140px;
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .blank-profile,
    .home {
      width: 40px;
      position: absolute;
      top: 20px;
    }

    .blank-profile {
      right: 60px;
    }

    .home {
      right: 20px;
    }

    .content {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 120px;
      gap: 60px;
    }

    .section {
      text-align: center;
    }

    .section img {
      border-radius: 20px;
      width: 300px;
      height: 180px;
      object-fit: cover;
      display: block;
      margin: 0 auto;
    }

    .section-title {
      font-size: 16px;
      font-weight: 500;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="main-page-after">
    <img class="sky-logo" src="img/sky-logo.png" alt="SkyCare Logo" />
    <img class="home" src="img/home.png" alt="Home" />
    <a href="Profile.html">
    <img class="blank-profile" src="img/blank-profile-picture.webp" alt="Profile" />
</a>

    <div class="content">
      <div class="section">
        <img src="img/sessions.jpg" alt="Sessions" />
        <div class="section-title">Sessions</div>
      </div>
      <div class="section">
        <img src="img/summary.jpg" alt="Summaries" />
        <div class="section-title">Summaries</div>
      </div>
      <div class="section">
        <img src="img/teams.jpg" alt="Teams" />
        <div class="section-title">Teams</div>
      </div>
    </div>
  </div>
</body>
</html>
