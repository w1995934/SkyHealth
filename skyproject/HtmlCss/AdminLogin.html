<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SkyCare Admin Login</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #fdaedf; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      .sky-logo {
        width: 250px;
        height: auto;
        margin-bottom: -150px;
        margin-left: 85px;
        
      }

      .text-content-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .subtitle {
        font-size: 1.5rem;
        font-weight: bold;
        color: #333;
      }

      .form-contact {
        background: #fdaedf;
        border: 1px solid #f8c1e5;
        border-radius: 8px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 300px;
      }

      .input-field {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .label {
        font-size: 0.9rem;
        color: #333;
      }

      .input {
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1rem;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .button {
        background-color: #333;
        color: white;
        border: none;
        padding: 0.7rem;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s ease;
      }

      .button:hover {
        background-color: #555;
      }
    </style>
  </head>
  <body>
    
    <div class="hero-form">
      <div class="text-content-title">
        <img class="sky-logo" src="img/sky-logo.png" alt="Sky Logo" />
        <div class="subtitle">Admin</div>
      </div>
      <div class="form-contact">
        <div class="input-field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" placeholder="Email" type="email" />
        </div>
        <div class="input-field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" placeholder="Password" type="password" />
        </div>
        <div class="button-group"><a href="ForgotPassword.html">
             <button class="button">Forgot Password</button></a>
         
          <button class="button">Login</button>
        </div>
      </div>
    </div>
  </body>
</html>
