<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkyCare Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fdaedf;
      display: flex;
      justify-content: center;
      align-items: start;
      padding-top: 40px;
      min-height: 100vh;
    }

    .profile-section {
      text-align: center;
      width: 100%;
      max-width: 400px;
      background-color: white;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 200px;
      display: block;
      margin: 0 auto 20px;
    }

    .home {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 28px;
      cursor: pointer;
    }

    .profile-pic-container {
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #ddd;
    }

    .info-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .info-group label {
      font-size: 12px;
      color: #777;
      display: block;
      margin-bottom: 5px;
    }

    .info-group p {
      font-size: 16px;
      font-weight: 500;
      color: #333;
      margin: 0;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 12px;
      color: #333;
    }

    .toggle-info {
      line-height: 1.4;
      text-align: left;
    }

    .toggle-switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    .toggle-switch input:checked + .slider {
      background-color: #111;
    }

    .toggle-switch input:checked + .slider:before {
      transform: translateX(14px);
    }
    

  </style>
</head>
<body>

  <img src="img/home.png" alt="Home" class="home" />

  <div class="profile-section">
    <img src="img/sky-logo.png" alt="SkyCare Logo" class="logo" />

    <div class="profile-pic-container">
      <img src="img/blank-profile-picture.webp" alt="Profile Picture" class="profile-pic" />
    </div>

    <div class="info-group">
      <label>Full Name</label>
      <p id="name">...</p>
    </div>

    <div class="info-group">
      <label>Email</label>
      <p id="email">...</p>
    </div>

    <div class="info-group">
      <label>Department</label>
      <p id="department">...</p>
    </div>

    <div class="toggle-container">
      <div class="toggle-info">
        <strong>Notification Preferences</strong><br />
        <span>Email reminders for sessions and updates</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="notificationToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  

</body>
</html>
