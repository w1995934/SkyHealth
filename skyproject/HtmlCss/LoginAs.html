<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title> Main Login Page</title>
  <style>
    .main-login-page {
      background-color: #fdaedf;
      display: flex;
      flex-direction: row;
      justify-content: center;
      width: 100%;
    }

    .main-login-page .div {
      background-color: #fdaedf;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    .main-login-page .overlap-group {
      position: absolute;
      width: 496px;
      height: 639px;
      top: 140px;
      left: 760px;
    }

    .main-login-page .sky-logo {
      position: absolute;
      width: 400px;
      height: 600px;
      top: 0;
      left: 0;
      object-fit: cover;
    }

    .main-login-page .text-wrapper {
      position: absolute;
      width: 178px;
      top: 353px;
      left: 111px;
      font-family: "JejuGothic-Regular", Helvetica, sans-serif;
      font-weight: 400;
      color: #000000;
      font-size: 32px;
      letter-spacing: 0;
      line-height: 44.8px;
    }

    .main-login-page .button-group,
    .main-login-page .button-group-2,
    .main-login-page .button-group-3,
    .main-login-page .button-group-4,
    .main-login-page .button-group-5 {
      display: flex;
      width: 160px;
      align-items: center;
      gap: 16px; 
      position: absolute;
    }

    .main-login-page .button-group {
      top: 451px;
      left: 74px;
    }

    .main-login-page .button-group-2 {
      top: 451px;
      left: 336px;
    }

    .main-login-page .button-group-3 {
      top: 591px;
      left: 310px;
    }

    .main-login-page .button-group-4 {
      top: 591px;
      left: 572px;
    }

    .main-login-page .button-group-5 {
      top: 591px;
      left: 1358px;
    }

    .main-login-page .button-group-6 {
      top: 806px;
      left: 834px;
      display: flex;
      width: 160px;
      align-items: center;
      gap: 16px;
      position: absolute;
    }

    .main-login-page .button {
      all: unset;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px; 
      width: 100%;
      background-color: #000000; 
      border-radius: 8px; 
      overflow: hidden;
      border: 1px solid #000000;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-login-page .text-wrapper-2 {
      position: absolute;
      width: 178px;
      top: 560px;
      left: 145px;
      font-family: "JejuGothic-Regular", Helvetica, sans-serif;
      font-weight: 400;
      color: #000000;
      font-size: 32px;
      letter-spacing: 0;
      line-height: 44.8px;
    }

    .main-login-page .home {
      position: absolute;
      width: 63px;
      height: 65px;
      top: 0;
      left: 1800px;
    }
  </style>
</head>

<body>
  <div class="main-login-page">
    <div class="div">
      <div class="overlap-group">
        <img class="sky-logo" src="img/sky-logo.png" alt="Sky Logo" />
        <div class="text-wrapper">Login as</div>

        <div class="button-group">
            <a href="DepartmentLeaderlogin.html">
                <button class="button">Department Leader</button>
              </a>
        </div>

        <div class="button-group-2">
            <a href="SeniorManagerLogin.html">
                <button class="button">Senior Manager</button>
              </a>
        </div>

        <div class="text-wrapper-2">Or</div>
      </div>

    

      <div class="button-group-3">
        <a href="EngineerLogin.html">
            <button class="button">Engineer</button>
          </a>
      </div>

      <div class="button-group-4">
        <a href="TeamLeaderLogin.html">
            <button class="button">Team Leader</button>
          </a>
      </div>

      <div class="button-group-5">
        <a href="AdminLogin.html">
          <button class="button">Admin</button>
        </a>
      </div>
      

      <div class="button-group-6">
        <a href="Register.html">
            <button class="button">Register</button>
          </a>      </div>
    </div>
  </div>
</body>
</html>
