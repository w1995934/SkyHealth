<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyCare Survey question 2</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'w1926950/style.css' %}" />
</head>
<body>
  <div class="container">
    <header>
      <img src="sky-logo.png" alt="SkyCare Logo" class="logo" />
      <div class="home-icon">🏠</div>
    </header>

    <h2>Question 2: Do you enjoy working with your team and find your work engaging?</h2>

    <div class="content">
      <div class="faces">
        <button class="face-button happy">
          😊
          <span>The team is motivated, and work feels exciting and rewarding.</span>
        </button>
        <button class="face-button neutral">
          😐
          <span>Work is fine, but not particularly enjoyable.</span>
        </button>
        <button class="face-button sad">
          ☹️
          <span>Work feels stressful or unengaging, and motivation is low.</span>
        </button>
      </div>

      <div class="bar">
        <div class="bar-segment low"></div>
        <div class="bar-segment low"></div>
      </div>
    </div>

    <div class="navigation">
        <button onclick="goToPrev()">&larr;</button>
        <button onclick="goToNext()">&rarr;</button>
      </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.face-button');
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
        console.log('Selected:', button.innerText.trim());
      });
    });
    function goToPrev() {
    window.location.href = 'question1.html'; 
  }

  function goToNext() {
    window.location.href = 'question3.html'; 
  }
  </script>
</body>
</html>
