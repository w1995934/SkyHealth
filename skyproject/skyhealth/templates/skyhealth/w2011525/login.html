{% extends 'main.html' %}

{% block title %}
SkyCare Login
{% endblock title %}

{% block extrastyle %}
<style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fdaedf;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .sky-logo {
      width: 250px;
      height: auto;
      margin-bottom: -150px;
      margin-left: 85px;

    }

    .text-content-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }

    .form-contact {
      background: #fdaedf;
      border: 1px solid #f8c1e5;
      border-radius: 8px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 300px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-size: 0.9rem;
      color: #333;
    }

    .input {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .button {
      background-color: #333;
      color: white;
      border: none;
      padding: 0.7rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #555;
    }
</style>
{% endblock extrastyle %}

{% block content %}
{% load static %}
<div class="hero-form">
    <div class="text-content-title">
        <img class="sky-logo" src="{% static 'w2011525/sky-logo.png' %}" alt="Sky Logo"/>
    </div>
    <div class="form-contact">
        <form method="POST">
            {% csrf_token %}
            <div class="input-field">
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" placeholder="Username" type="text"/>
            </div>
            <div class="input-field">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" placeholder="Password" type="password"/>
            </div>
            <div class="button-group">
                <!--                <a href="ForgotPasswordForEngineer.html">-->
                <!--                    <button type="button" class="button">Forgot Password</button>-->
                <!--                </a>-->
                <button type="submit" class="button">Login</button>
            </div>
        </form>
        <div>
            <small>
                Need An Account? <a href="{% url 'skyhealth_signup' %}">Sign Up Now</a>
            </small>
        </div>
    </div>
</div>
{% endblock content %}
