<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyCare Register</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fdaedf;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .hero-form {
      background-color: #fdaedf;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-content-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title img {
      width: 120px;
      height: auto;
    }

    .subtitle {
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .form-contact {
      background-color: #fdaedf;
      padding: 30px 40px;
      border-radius: 8px;
     
      min-width: 300px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }

    .input-field label {
      font-size: 12px;
      margin-bottom: 5px;
    }

    .input-field input {
      padding: 8px 10px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
    }

    .textarea-field {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .textarea-field label {
      font-size: 12px;
      margin-bottom: 5px;
    }

    .textarea-field input {
      padding: 8px 10px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
    }

    .button {
      width: 100%;
      background-color: #222;
      color: white;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .button:hover {
      background-color: #111;
    }

    .logo {
      display: block;
      margin: 0 auto 10px auto;
      width: 130px;
    }
  </style>
</head>
<body>
  <div class="hero-form">
    <div class="text-content-title">
      <div class="title">
        
        <img src="img/sky-logo.png" alt="SkyCare Logo" class="logo" />
      </div>
      <div class="subtitle">Register</div>
    </div>
    <form class="form-contact">
      <div class="input-field">
        <label for="fullname">Full Name</label>
        <input id="fullname" type="text" placeholder="Full Name" required />
      </div>

      <div class="input-field">
        <label for="department">Department</label>
        <input id="department" type="text" placeholder="Department" required />
      </div>

      <div class="input-field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Email" required />
      </div>

      <div class="textarea-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" required />
      </div>
      <div class="textarea-field">
        <label for="password"> Second Password</label>
        <input id="password" type="password" placeholder=" Second Password" required />
      </div>

      <button type="submit" class="button">Register</button>
    </form>
  </div>
</body>
</html>
